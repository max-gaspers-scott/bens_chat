[package]
name = "bens-chat-shared"
version = "0.2.0"
edition = "2024"
description = "This crate lest anyone make programs that send and receive messages for bens chat"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = [
  "runtime-tokio-rustls",
  "postgres",
  "chrono",
  "uuid",
], optional = true }
reqwest = { version = "0.13.5", features = ["json"] }

[features]
db = ["sqlx"]
sqlx = ["dep:sqlx"]
